name: lint

# setup.sh раздаётся по сырой ссылке и обновляет сам себя при каждом запуске —
# битый скрипт в main разъедется по всем серверам, где стоит usfc. Поэтому
# синтаксис и линтер проверяются на каждый push, а не когда-нибудь потом.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Синтаксис (bash -n)
        run: |
          bash -n src/setup.sh
          bash -n install.sh
          # каждый модуль обязан быть синтаксически целым сам по себе:
          # так разрез, попавший в середину функции, виден сразу
          while IFS= read -r m; do
            # пустые строки и комментарии — как их пропускает сам загрузчик
            case "$m" in ''|'#'*) continue ;; esac
            bash -n "src/$m" || { echo "битый модуль: $m" >&2; exit 1; }
          done < src/MODULES

      - name: Манифест совпадает с содержимым src/lib
        run: |
          # Ни осиротевших файлов, ни забытых строк: MODULES — единственный
          # источник правды и для загрузки, и для обновления
          find src/lib -name '*.sh' | sed 's|^src/||' | sort > /tmp/on-disk
          grep -vE '^\s*(#|$)' src/MODULES | sort > /tmp/in-manifest
          diff /tmp/in-manifest /tmp/on-disk || {
            echo "src/MODULES разошёлся с src/lib (< манифест, > диск)" >&2; exit 1; }
          echo "модулей: $(wc -l < /tmp/on-disk)"

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning src/setup.sh install.sh tests/*.sh
          # Модули линтуются СБОРКОЙ, а не по одному: по отдельности shellcheck
          # не видит межмодульных REPLY_*-переменных и сыпет ложными SC2034.
          # Сборка — это ровно то, что выполняется на машине (тот же порядок).
          bash tests/assemble.sh > /tmp/usfc-assembled.sh
          shellcheck -S warning /tmp/usfc-assembled.sh

      - name: Определение ОС на Ubuntu и Debian
        run: |
          # Гейт и distro-aware списки проверяются на настоящих образах:
          # в Debian 12 нет eza, в Debian 13 нет software-properties-common,
          # и раньше пункты из-за этого висели бы «не применёнными» навсегда
          for img in ubuntu:24.04 debian:12 debian:13; do
            echo "── $img ──"
            docker run --rm -v "$PWD:/w" -w /w "$img" bash -c '
              USFC_SOURCE_ONLY=1 bash -c "
                source src/setup.sh
                require_supported_os || { echo \"гейт отверг поддерживаемую ОС\" >&2; exit 1; }
                echo \"  OS_ID=\$OS_ID codename=\$OS_CODENAME\"
                echo \"  CLI_PKGS=\$CLI_PKGS\"
                case \"\$OS_ID\" in
                  debian) case \" \$BASE_PKGS \" in *software-properties-common*)
                            echo \"  s-p-c не должен попадать в Debian\" >&2; exit 1;; esac ;;
                esac
              "'
          done

      - name: Неинтерактивный режим и профили
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            # python3 нужен tests/test_audit.sh: он разбирает и проверяет JSON
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq python3 >/dev/null 2>&1
            # ...и сразу чистим списки: ниже в этом же шаге стоит проверка
            # «сухой прогон не трогал /var/lib/apt/lists», а наша установка
            # их наполнила бы и провалила её не по делу
            rm -rf /var/lib/apt/lists/*
            mkdir -p /opt/vps-setup && cp -r /w/src/. /opt/vps-setup/
            chmod +x /opt/vps-setup/setup.sh
            ln -sf /opt/vps-setup/setup.sh /usr/local/bin/usfc

            # имя профиля не должно совпадать с id пункта: профиль docker
            # перебивал одноимённый пункт и разворачивался в восемь вместо одного
            USFC_SOURCE_ONLY=1 bash -c "source /opt/vps-setup/setup.sh; usfc_check_profile_names" \
              || { echo "коллизия имён профилей" >&2; exit 1; }

            usfc --list >/dev/null || { echo "--list упал" >&2; exit 1; }

            # опечатка — код 2, а не тихий успех
            if usfc --apply nosuchprofile --dry-run >/dev/null 2>&1; then
              echo "опечатка в --apply не дала ошибки" >&2; exit 1
            fi

            # сухой прогон ничего не ставит и завершается нулём
            usfc --apply all --dry-run >/dev/null 2>&1 || { echo "--dry-run вернул ошибку" >&2; exit 1; }
            command -v docker >/dev/null && { echo "сухой прогон установил docker" >&2; exit 1; }
            [ "$(ls /var/lib/apt/lists/ 2>/dev/null | wc -l)" -eq 0 ] \
              || { echo "сухой прогон трогал списки apt" >&2; exit 1; }
            # Сухой прогон обязан НЕ МЕНЯТЬ систему. Глазами это не проверить:
            # изменяющих вызовов около сотни. Сверяем слепок до и после
            bash /w/tests/test_dryrun.sh || exit 1
            # аудит обязан быть чисто читающим — та же проверка слепком
            bash /w/tests/test_audit.sh || exit 1
            echo "неинтерактивный режим в порядке"
          '

      - name: Снимки конфигов и откат
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq unattended-upgrades >/dev/null 2>&1
            mkdir -p /opt/vps-setup && cp -r /w/src/. /opt/vps-setup/
            chmod +x /opt/vps-setup/setup.sh
            ln -sf /opt/vps-setup/setup.sh /usr/local/bin/usfc
            bash /w/tests/test_backup.sh
          '

      - name: Тесты раскладки во всех локалях
        run: |
          # Функции отрисовки меню переписаны с python3 на чистый bash — тест
          # сверяет их со старыми реализациями и проверяет инварианты рамки.
          # Прогоняем и с рабочей UTF-8-локалью, и с побайтовым фолбэком.
          for cfg in "LANG=C.UTF-8" "LANG=en_US.UTF-8" \
                     "USFC_KEEP_LOCALE=1 LANG=C" "USFC_KEEP_LOCALE=1 LANG=POSIX"; do
            echo "── $cfg ──"
            env $cfg bash tests/test_layout.sh src/setup.sh
          done

      - name: Рамки и выравнивание на всех ширинах и обоих языках
        run: |
          # Английский и русский дают разную длину строк, и рамка едет там,
          # где по-русски всё влезало: «S servicesP security» без пробела
          # между ячейками — ровно это и ловится здесь
          bash tests/test_help_widths.sh src/setup.sh

      - name: Рекомендованные sysctl под zram
        run: |
          # Жалоба была ровно на это: при массовом применении настройки тихо
          # не применялись, потому что дефолт вычислялся из текущих значений
          bash tests/test_sysctl.sh src/setup.sh

      - name: Аргументы установщика
        run: |
          # В контейнере, потому что install.sh первой строкой требует root,
          # а пользователь раннера — не root. Сеть при этом не нужна: curl
          # подменён шимом, setup.sh в фикстуре — заглушка, печатающая аргументы.
          # Проверяется то, что раньше не проверялось вовсе: install.sh падал
          # на любом незнакомом аргументе, а без терминала — на последнем шаге
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 \
            bash tests/test_install_args.sh install.sh

      - name: Блок алиасов в .bashrc
        run: |
          # Ловушка, из-за которой добавленный алиас не доезжал ни до одной
          # уже настроенной машины: пункт выходил по факту наличия маркера
          bash tests/test_cli_block.sh src/setup.sh

      - name: Доступность модуля ядра zram
        run: |
          # Пять состояний машины (модуль есть, контейнер, ядро без
          # перезагрузки, ядро провайдера, поправимо пакетом) на одном раннере
          # не воспроизвести — тест подменяет modinfo, systemd-detect-virt,
          # uname и apt, а логику пункта гоняет настоящую
          bash tests/test_zram_module.sh src/setup.sh

      - name: Полное удаление скрипта
        run: |
          # Работает на настоящей файловой системе во временном каталоге:
          # смысл проверки ровно в том, ЧТО осталось на диске после rm —
          # заглушками этого не увидеть
          bash tests/test_uninstall.sh src/setup.sh

      - name: Реестр пунктов согласован
        run: |
          # Параллельность массивов больше не проверяем: их наполняет usfc_item,
          # рассинхронизировать нечего по построению. Зато проверяем то, что
          # регистрация действительно случилась и у каждого пункта есть код.
          USFC_SOURCE_ONLY=1 bash -c '
            source src/setup.sh
            n=${#ITEM_IDS[@]}
            [ "$n" -gt 0 ] || { echo "реестр пуст: ни один lib/items/* не зарегистрировался" >&2; exit 1; }
            for name in ITEM_TITLES ITEM_SECTIONS ITEM_SHORT ITEM_FULL ROLLBACK_NOTES; do
              declare -n arr="$name"
              [ "${#arr[@]}" -eq "$n" ] || { echo "$name: ${#arr[@]} против ${n}" >&2; exit 1; }
            done
            for id in "${ITEM_IDS[@]}"; do
              declare -F "status_${id}" >/dev/null || { echo "нет status_${id}" >&2; exit 1; }
              declare -F "apply_${id}"  >/dev/null || { echo "нет apply_${id}"  >&2; exit 1; }
              [ -f "src/lib/items/${id}.sh" ] || { echo "нет файла пункта ${id}" >&2; exit 1; }
            done
            # у помеченного ⇄ обязана быть функция выключения
            for id in "${DISABLE_SUPPORTED[@]}"; do
              declare -F "disable_${id}" >/dev/null || { echo "нет disable_${id}" >&2; exit 1; }
            done
            # каждый файл пункта обязан себя зарегистрировать
            for f in src/lib/items/*.sh; do
              id="$(basename "$f" .sh)"
              case " ${ITEM_IDS[*]} " in *" $id "*) ;; *)
                echo "файл $f есть, а пункт $id не зарегистрирован" >&2; exit 1 ;;
              esac
            done
            echo "реестр согласован: ${n} пунктов, из них с ⇄ — ${#DISABLE_SUPPORTED[@]}"
          '
